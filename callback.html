<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok login — Football Timeline</title>
<style>
  body { margin: 0; background: #f7f7f8; color: #1d2330; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; font: 13px/1.4 ui-monospace, Consolas, monospace;
             padding: 10px; border: 1px solid #d0d4da; border-radius: 8px; background: #fff; word-break: break-all; }
  button { margin-top: 10px; padding: 10px 18px; font-size: 15px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; cursor: pointer; }
  .ok { color: #15803d; } .bad { color: #b91c1c; } .muted { color: #6b7280; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">TikTok login</h1>
  <p id="hint"></p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Скопіювати</button> <span id="copied" class="ok"></span>
  <p class="muted">Ця сторінка нічого нікуди не надсилає: вона лише показує адресу, яку треба вставити в
  <code>python tiktok_auth.py</code>.</p>
</main>
<script>
  // Static helper: shows the redirect address (with ?code=...&state=...) for the local login script
  var params = new URLSearchParams(location.search);
  var title = document.getElementById("title"), hint = document.getElementById("hint");
  var box = document.getElementById("url");
  box.value = location.href;
  if (params.get("code")) {
    title.textContent = "✅ Вхід у TikTok виконано";
    hint.textContent = "Скопіюй адресу нижче і встав її в консоль, де запущено tiktok_auth.py.";
  } else if (params.get("error")) {
    title.textContent = "❌ TikTok повернув помилку";
    title.className = "bad";
    hint.textContent = (params.get("error") || "") + " " + (params.get("error_description") || "");
  } else {
    hint.textContent = "Сторінка для входу через TikTok. Відкривається автоматично після «Authorize».";
  }
  document.getElementById("copy").onclick = function () {
    box.select();
    try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
    document.getElementById("copied").textContent = "Скопійовано";
  };
</script>
</body>
</html>
